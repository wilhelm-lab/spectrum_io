name: Release Drafter

on:
    push:
        branches:
            - development
    pull_request_target:
        types: [opened, reopened, synchronize, edited]

# pull_request_target runs on the base branch, so key PR events by number to
# stop one PR's run from cancelling another's or the release draft update.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    update_release_draft:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
        steps:
            - uses: release-drafter/release-drafter@v7

    # Since v7 the autolabeler is a separate action from the release drafter.
    auto_label:
        if: github.event_name == 'pull_request_target'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: release-drafter/release-drafter/autolabeler@v7
